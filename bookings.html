<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bookings · De-Vef Beauty</title>
  <meta name="theme-color" content="#111111" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23111'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='%23ffc21a' font-family='Arial Black,Arial,sans-serif' font-weight='900'>D</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="bookings.css" />
</head>
<body class="owner">
  <!-- PITCH DEMO: sample owner page. The real one needs a login and a database (see Lee's admin.html). -->
  <header class="owner-bar">
    <div class="wrap owner-bar-inner">
      <a href="./" class="brand">DE-VEF<span>beauty</span></a>
      <a href="./#book" class="btn btn-sm btn-line">Back to the site</a>
    </div>
  </header>

  <main class="wrap owner-main">
    <p class="preview-note owner-note"><span class="tag">Preview</span> This is what De-Vef would see after signing in: every booking, chair by chair. Names are samples. Bookings you make on the site show up here.</p>

    <div class="owner-head">
      <h1 id="dayTitle">Today</h1>
      <div class="day-nav">
        <button type="button" class="icon-btn" id="prev" aria-label="Previous day"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
        <label class="sr-only" for="day">Pick a day</label>
        <input type="date" id="day" />
        <button type="button" class="icon-btn" id="next" aria-label="Next day"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
      </div>
    </div>
    <p class="owner-count" id="count" aria-live="polite"></p>

    <div class="board" id="board"></div>

    <section class="detail" id="detail" tabindex="-1" hidden aria-live="polite"></section>

    <p class="owner-foot"><button type="button" class="link" id="reset">Reset the preview</button> (removes test bookings made in this browser)</p>
  </main>

  <script type="module" src="bookings.js"></script>
</body>
</html>
